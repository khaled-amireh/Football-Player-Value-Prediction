<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">Football Intelligence</title>
  <desc id="description">A midnight navy football analytics banner. Ice white typography reads Football Intelligence. An emerald tactical pitch shows abstract player markers and teal tracking routes. The illustration contains no measured model results.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#07131F"/>
      <stop offset="0.6" stop-color="#0A2029"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.065"/>
    </pattern>
    <clipPath id="frame"><rect width="1440" height="480" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1440" height="480" fill="url(#background)"/>
    <rect x="760" width="680" height="480" fill="url(#grid)"/>

    <!-- Abstract stadium tiers and a restrained horizon. -->
    <g fill="none" stroke="#94A3B8" stroke-opacity="0.09">
      <path d="M748 141Q1095 -17 1485 132"/>
      <path d="M762 157Q1100 9 1474 147"/>
      <path d="M777 173Q1105 35 1462 162"/>
      <path d="M792 189Q1110 61 1450 177"/>
    </g>
    <path d="M690 210H1440" stroke="url(#horizon)"/>

    <!-- A schematic pitch, with no affiliation or real player locations. -->
    <g transform="translate(880 82) rotate(12 225 150)">
      <rect x="0" y="0" width="452" height="310" rx="3" fill="url(#pitch)" stroke="#14B8A6" stroke-opacity="0.55" stroke-width="1.5"/>
      <g fill="none" stroke="#94A3B8" stroke-width="1.1" stroke-opacity="0.32">
        <path d="M226 0V310"/>
        <circle cx="226" cy="155" r="48"/>
        <path d="M0 78H74V232H0M452 78H378V232H452"/>
        <path d="M0 119H27V191H0M452 119H425V191H452"/>
        <path d="M74 122Q105 155 74 188M378 122Q347 155 378 188"/>
        <path d="M0 8Q8 8 8 0M444 0Q444 8 452 8M0 302Q8 302 8 310M444 310Q444 302 452 302"/>
      </g>
      <g fill="#94A3B8" fill-opacity="0.65">
        <circle cx="226" cy="155" r="2.5"/>
        <circle cx="51" cy="155" r="2"/>
        <circle cx="401" cy="155" r="2"/>
      </g>
      <g fill="none" stroke="#14B8A6" stroke-width="1.6">
        <path d="M63 188L140 219L227 155L301 94L378 114" stroke-opacity="0.75"/>
        <path d="M141 75L227 155L309 239" stroke-dasharray="5 7" stroke-opacity="0.55"/>
        <path d="M140 219Q184 250 243 248" stroke-opacity="0.35"/>
      </g>
      <g fill="#07131F" stroke="#14B8A6" stroke-width="2">
        <circle cx="63" cy="188" r="6"/>
        <circle cx="140" cy="219" r="6"/>
        <circle cx="141" cy="75" r="6"/>
        <circle cx="301" cy="94" r="6"/>
        <circle cx="309" cy="239" r="6"/>
        <circle cx="378" cy="114" r="6"/>
      </g>
      <circle cx="227" cy="155" r="15" fill="none" stroke="#14B8A6" stroke-opacity="0.35"/>
      <circle cx="227" cy="155" r="6" fill="#F1F5F9" stroke="#14B8A6" stroke-width="2"/>
      <g fill="#94A3B8" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1">
        <text x="128" y="59">01</text>
        <text x="288" y="78">02</text>
        <text x="296" y="265">03</text>
      </g>
    </g>

    <!-- System fonts keep the image independent of remote fonts and CSS. -->
    <rect x="66" y="70" width="32" height="3" rx="1.5" fill="#14B8A6"/>
    <text x="112" y="77" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="4">FOOTBALL ANALYTICS / MACHINE LEARNING</text>
    <g fill="#F1F5F9" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" letter-spacing="1">
      <text x="62" y="184">FOOTBALL</text>
      <text x="62" y="264">INTELLIGENCE</text>
    </g>
    <text x="66" y="316" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="0.5">Predicting Player Market Value Through Machine Learning</text>
    <path d="M66 360H695" stroke="#94A3B8" stroke-opacity="0.22"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="2.3">
      <text x="66" y="400" fill="#14B8A6">PLAYER ATTRIBUTES</text>
      <text x="286" y="400" fill="#94A3B8">/</text>
      <text x="314" y="400" fill="#F1F5F9">RANDOM FOREST</text>
      <text x="507" y="400" fill="#94A3B8">/</text>
      <text x="535" y="400" fill="#F1F5F9">VALUATION</text>
    </g>
    <text x="1348" y="434" text-anchor="end" fill="#94A3B8" font-family="Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2">TACTICAL SCHEMATIC</text>
    <path d="M0 477H1440" stroke="#14B8A6" stroke-opacity="0.55" stroke-width="3"/>
  </g>
</svg>
